services:
  mysql:
    image: mysql:8.4
    container_name: store-mysql
    environment:
      MYSQL_ROOT_PASSWORD: MyPassword!
      MYSQL_DATABASE: store_api
    ports:
      - "3307:3306" # 3306 is often taken by a local MySQL install
    volumes:
      - store-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  store-mysql-data:
    name: store-mysql-data
