spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
# Fix beyond the course: Railway terminates TLS at its edge and forwards plain HTTP plus X-Forwarded-Proto/Host.
# Without this, Spring built absolute URLs from the proxied request: the OpenAPI document advertised an http://
# server (so "Try it out" in the https Swagger UI was blocked as mixed content) and 201 Location headers were http://.
# "framework" registers Spring's ForwardedHeaderFilter (highest precedence, ahead of Spring Security); it trusts the
# headers unconditionally, which is fine here because the container is only reachable through Railway's proxy.
server:
  forward-headers-strategy: framework
websiteUrl: https://mystore.com
