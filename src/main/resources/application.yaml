spring:
  application:
    name: store
  jwt:
    secret: ${JWT_SECRET:}
    accessTokenExpiration: 900 # 15m
    refreshTokenExpiration: 604800 # 7d
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  # Browsers revalidate scripts and styles on every load, so a deploy never mixes old and new files.
  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true
stripe:
  secretKey: ${STRIPE_SECRET_KEY:}
  webhookSecretKey: ${STRIPE_WEBHOOK_SECRET_KEY:}
# emails: comma-separated e-mails that get the ADMIN role on registration or at startup.
# default-email and default-password: admin account created at startup if it doesn't exist.
admin:
  emails: ${ADMIN_EMAILS:}
  default-email: ${DEFAULT_ADMIN_EMAIL:}
  default-password: ${DEFAULT_ADMIN_PASSWORD:}
springdoc:
  default-produces-media-type: application/json
  swagger-ui:
    persist-authorization: true
    display-request-duration: true
    operations-sorter: method
    doc-expansion: list
    try-it-out-enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
