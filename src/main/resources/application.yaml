spring:
  application:
    name: store
  jwt:
    secret: ${JWT_SECRET:}
    accessTokenExpiration: 900 # 15m
    refreshTokenExpiration: 604800 # 7d
  profiles:
    active: dev
stripe:
  secretKey: ${STRIPE_SECRET_KEY:}
  webhookSecretKey: ${STRIPE_WEBHOOK_SECRET_KEY:}
# Comma-separated e-mails that get the ADMIN role on registration or at startup.
admin:
  emails: ${ADMIN_EMAILS:}
springdoc:
  default-produces-media-type: application/json
  swagger-ui:
    persist-authorization: true
    display-request-duration: true
    operations-sorter: method
    doc-expansion: list
    try-it-out-enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
