<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(title='My orders | Tyrone Grocery Shop')}">
    <title>My orders | Tyrone Grocery Shop</title>
</head>
<body>
<th:block th:replace="~{fragments :: top}"></th:block>
<header th:replace="~{fragments :: header(page='orders')}"></header>
<div th:replace="~{fragments :: banner}"></div>

<main id="main" class="mx-auto max-w-4xl px-4 pt-8 sm:px-6 sm:pt-12 lg:px-8">
    <div class="flex animate-fade-up flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
        <div>
            <nav aria-label="Breadcrumb">
                <ol class="flex items-center gap-1.5 text-sm text-stone-500">
                    <li><a href="/" class="transition hover:text-stone-900">Shop</a></li>
                    <li aria-hidden="true"><svg class="icon size-3.5 text-stone-400"><use href="#i-chevron-right"/></svg></li>
                    <li class="font-medium text-stone-800" aria-current="page">My orders</li>
                </ol>
            </nav>
            <h1 class="mt-3 text-3xl font-bold tracking-tight text-stone-900">My orders</h1>
            <p class="mt-1.5 text-stone-500">Follow the payment and delivery of everything you have ordered.</p>
        </div>
        <button id="refresh-orders-btn" type="button" class="btn btn-secondary self-start sm:self-auto" hidden>
            <svg class="icon"><use href="#i-refresh"/></svg>Refresh
        </button>
    </div>

    <div id="orders-tabs" class="tabs mt-8" role="tablist" aria-label="Filter orders" hidden>
        <button type="button" id="tab-all" class="tab" role="tab" data-tab="all" aria-controls="orders-panel" aria-selected="true">
            All <span class="tab-count" data-count="all">0</span>
        </button>
        <button type="button" id="tab-active" class="tab" role="tab" data-tab="active" aria-controls="orders-panel" aria-selected="false" tabindex="-1">
            In progress <span class="tab-count" data-count="active">0</span>
        </button>
        <button type="button" id="tab-delivered" class="tab" role="tab" data-tab="delivered" aria-controls="orders-panel" aria-selected="false" tabindex="-1">
            Delivered <span class="tab-count" data-count="delivered">0</span>
        </button>
        <button type="button" id="tab-cancelled" class="tab" role="tab" data-tab="cancelled" aria-controls="orders-panel" aria-selected="false" tabindex="-1">
            Cancelled <span class="tab-count" data-count="cancelled">0</span>
        </button>
    </div>

    <section id="orders-panel" class="mt-6" role="tabpanel" aria-labelledby="tab-all">
        <div id="orders-list" class="space-y-4">
            <div th:each="i : ${#numbers.sequence(1, 3)}" class="card overflow-hidden" aria-hidden="true">
                <div class="flex items-center gap-3 border-b border-stone-100 px-5 py-4">
                    <span class="skeleton size-10 rounded-xl"></span>
                    <span class="flex-1 space-y-2"><span class="skeleton h-4 w-28"></span><span class="skeleton h-3 w-40"></span></span>
                    <span class="skeleton h-6 w-20 rounded-full"></span>
                </div>
                <div class="grid grid-cols-3 gap-4 px-5 py-6">
                    <span class="skeleton h-8"></span><span class="skeleton h-8"></span><span class="skeleton h-8"></span>
                </div>
            </div>
        </div>
    </section>
</main>

<footer th:replace="~{fragments :: footer}"></footer>
<th:block th:replace="~{fragments :: dialogs}"></th:block>

<script type="module" src="/js/orders.js"></script>
</body>
</html>
